<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">landing-from-reference — 从参考到产品落地页</title>
  <desc id="desc">ECdison6227 的 Agent 技能。流程示意：拆解参考录屏、网址或截图，对齐产品真实功能与组件，再实现 Landing 并在桌面和手机上验收。</desc>
  <rect width="1200" height="500" rx="24" fill="#F5F2EB"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172D3C">

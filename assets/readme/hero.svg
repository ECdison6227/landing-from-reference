      <text x="496" y="365" font-size="23">品牌、文案与入口</text>
      <text x="462" y="405" font-size="22" fill="#586A71">借鉴表达，讲清自己的产品</text>
    </g>
    <g id="implementation-and-review" fill="#F5F2EB">
      <text x="838" y="288" font-size="26" font-weight="650">03 / 实现并验收</text>
      <rect x="838" y="311" width="158" height="64" rx="5" fill="none" stroke="#9DB1B4" stroke-width="1.5"/>
      <path d="M850 324h67M850 335h85M850 356h25" fill="none" stroke="#F5F2EB" stroke-width="4"/>
      <rect x="1021" y="311" width="35" height="64" rx="5" fill="none" stroke="#9DB1B4" stroke-width="1.5"/>
      <path d="M1028 324h21M1028 335h21" stroke="#F5F2EB" stroke-width="3"/>
      <path d="M1079 342l9 9 20-22" fill="none" stroke="#F2A58E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="838" y="405" font-size="22" fill="#CAD5D5">桌面 + 手机 · 交互与交付</text>
    </g>
    <g id="workflow-connections" fill="none" stroke="#D45131" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

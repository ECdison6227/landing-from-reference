      <path d="M71 49h10v10H71z" fill="#F5F2EB"/>
      <text x="104" y="62" font-size="22" font-weight="600">ECdison6227 / AGENT SKILL</text>
      <text x="64" y="139" font-size="61" font-weight="750" letter-spacing="-2">landing-from-reference</text>
      <text x="64" y="195" font-size="35" font-weight="500">把参考的表达方式，变成你产品的落地页。</text>
    </g>
    <g id="workflow" stroke="#D7D9D3" stroke-width="1.5">
      <rect x="64" y="250" width="320" height="176" rx="12" fill="#FFFFFF"/>
      <rect x="440" y="250" width="320" height="176" rx="12" fill="#FFFFFF"/>
      <rect x="816" y="250" width="320" height="176" rx="12" fill="#172D3C" stroke="#172D3C"/>
    </g>
    <g id="reference-input">
      <text x="86" y="288" font-size="26" font-weight="650">01 / 拆解参考</text>
      <g fill="#E8EEEC">
        <rect x="86" y="311" width="82" height="60" rx="5"/>
        <rect x="178" y="311" width="82" height="60" rx="5"/>
        <rect x="270" y="311" width="82" height="60" rx="5"/>
      </g>
      <path d="M117 326l21 15-21 15z" fill="#D45131"/>
      <path d="M189 325h58M189 336h34M189 347h49" stroke="#789087" stroke-width="5"/>
      <path d="M280 325h60v8h-60zM280 340h26v21h-26zM313 340h27v21h-27z" fill="#9AADA5"/>
      <text x="86" y="405" font-size="22" fill="#586A71">录屏 · 网址 · 截图</text>
    </g>
    <g id="real-product-context">
